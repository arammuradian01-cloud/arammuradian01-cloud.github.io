<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Рынки КАСКО и ОСАГО</title>
<style>
:root { color-scheme: light dark;
  --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --color-fg: #1f1e1d; --color-fg-muted: #6b6a68; --color-bg: #faf9f5; --color-panel: #ffffff; --color-border-line: #e5e3dc;
  --color-ok: #2f7a3b; --color-bad: #b3261e;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-pad-xs: 4px; --cds-pad-sm: 6px; --cds-pad-md: 10px; --cds-pad-lg: 16px; --cds-radius: 8px;
  --cds-font-size-title: 28px; --cds-font-size-heading: 17px; --cds-font-size-body: 14px; --cds-font-size-caption: 12px; --cds-font-weight-medium: 600;
  --cds-chart-grid: #ecebe6; --cds-chart-axis: #9a988f; --cds-chart-muted: #c9c6bd; --cds-chart-reference: #8a887f; --cds-chart-status-critical: #d9534f;
  --cds-surface-popover: #ffffff; --cds-border: #dddbd3; --cds-shadow-popover: 0 2px 10px rgba(0,0,0,.14); --cds-text-secondary: #77756f; --cds-dur-slow: .3s; }
@media (prefers-color-scheme: dark) { :root {
  --color-fg: #ecebe6; --color-fg-muted: #a3a19a; --color-bg: #1d1c1a; --color-panel: #262523; --color-border-line: #3a3935;
  --color-ok: #6fbf7b; --color-bad: #ef7d74; --cds-chart-grid: #33322f; --cds-chart-axis: #77756f; --cds-chart-muted: #5a5853; --cds-chart-reference: #8a887f;
  --cds-chart-status-critical: #e0675f; --cds-surface-popover: #2e2d2a; --cds-border: #45433f; --cds-text-secondary: #a3a19a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); }
#dash-root { max-width: 1320px; margin: 0 auto; padding: 20px 16px 48px; }
.dash-skeleton { opacity: .45; }
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.gate form { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 10px; padding: 24px; width: min(100%, 22rem); display: flex; flex-direction: column; gap: 10px; }
.gate h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 24px; margin: 0 0 4px; }
.gate p { margin: 0; font-size: 13px; color: var(--color-fg-muted); }
.gate label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--color-fg-muted); }
.gate input { font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--color-border-line); border-radius: 8px; background: var(--color-panel); color: var(--color-fg); }
.gate button { font: inherit; font-size: 15px; padding: 10px; border: 0; border-radius: 8px; background: var(--color-fg); color: var(--color-bg); cursor: pointer; }
.gate button:disabled { opacity: .6; cursor: default; }
.gate .err { color: var(--color-bad); min-height: 1.2em; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gate-form" autocomplete="on">
    <h1>Рынки КАСКО и ОСАГО</h1>
    <p>Введите логин и пароль, чтобы открыть дашборд.</p>
    <label>Логин <input name="l" autocomplete="username" required></label>
    <label>Пароль <input name="p" type="password" autocomplete="current-password" required></label>
    <p class="err" id="gate-err"></p>
    <button type="submit">Войти</button>
  </form>
</div>
<div id="dash-root" hidden></div>

  const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const form = document.getElementById('gate-form'), err = document.getElementById('gate-err'), btn = form.querySelector('button');
  async function decrypt(login, pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(login + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(ENC.iv) }, key, un(ENC.ct));
    const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  function start(P) {
    const st = document.createElement('style'); st.textContent = P.style; document.head.appendChild(st);
    document.getElementById('gate').remove();
    const root = document.getElementById('dash-root'); root.innerHTML = P.body; root.hidden = false;
    const calcs = {}, cache = {}, cbs = [];
    let params = P.params;
    try { const s = JSON.parse(localStorage.getItem('kx-params') || 'null'); if (s) params = { ...params, ...s }; } catch (e) {}
    window.dash = {
      calc: (id, o) => { calcs[id] = o; },
      data: (id) => {
        if (id in P.data) return { status: 'ok', data: P.data[id] };
        const c = calcs[id]; if (!c) return { status: 'error', data: [] };
        if (!(id in cache)) { try { cache[id] = c.fn(...c.inputs.map((i) => window.dash.data(i).data)); } catch (e) { console.error(id, e); cache[id] = null; } }
        return cache[id] ? { status: 'ok', data: cache[id] } : { status: 'error', data: [] };
      },
      params: () => params,
      setParams: (o) => { params = { ...params, ...o }; try { localStorage.setItem('kx-params', JSON.stringify(params)); } catch (e) {} cbs.forEach((f) => f()); },
      setLink: (id) => { try { history.replaceState(null, '', '#' + id); } catch (e) {} },
      onData: (f) => { cbs.push(f); setTimeout(f, 0); },
      colors: ['#c96442', '#5b7fa3', '#7a9e6b', '#b08a3e', '#8a6bb0', '#4f9a9a', '#a35b6f', '#6b6b6b'],
    };
    for (const code of P.js) { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); }
    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => window.KX && window.KX.redraw && window.KX.redraw(), 150); });
  }
  const KEY = 'kx-cred';
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Проверяю...';
    const l = form.l.value.trim(), p = form.p.value;
    try { const P = await decrypt(l, p); try { sessionStorage.setItem(KEY, JSON.stringify([l, p])); } catch (x) {} start(P); }
    catch (x) { err.textContent = window.crypto && crypto.subtle ? 'Неверный логин или пароль.' : 'Браузер не поддерживает расшифровку, откройте страницу по https.'; form.p.value = ''; btn.disabled = false; btn.textContent = 'Войти'; }
  });
  try { const c = JSON.parse(sessionStorage.getItem(KEY) || 'null'); if (c) decrypt(c[0], c[1]).then(start).catch(() => {}); } catch (e) {}
})();
